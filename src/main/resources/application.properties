spring.application.name=backend

openai.api.key=${OPENAIAPI}
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_NAME}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# Hikari connection pool logging
logging.level.com.zaxxer.hikari=DEBUG

spring.datasource.hikari.maximum-pool-size=5 # At a single time database can handle 5 requests